[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-face"
version = "0.0.333"
description = "Multi-tool face detection pipeline writing results to sidecar-rs .scar files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "meta_face contributors" }]
dependencies = [
    "click>=8.1",
    "rq>=2.0",
    "redis>=5.0",
    "insightface>=0.7.3",
    "face_recognition>=1.3.0",
    # GPU wheel only. Do not list the CPU package `onnxruntime` (it shadows CUDA).
    "onnxruntime-gpu[cuda,cudnn]>=1.17",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "hdbscan>=0.8.33",
    "faiss-gpu-cu12>=1.8.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "sidecar-rs @ git+https://github.com/dapperfu/sidecar-rs.git@v0.2.4",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipython>=8.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "seaborn>=0.13",
]

[project.scripts]
meta-face = "meta_face.cli:main"
mf = "meta_face.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "deepface>=0.0.100,<1",
    "tf-keras>=2.16",
    "uniface>=4,<5",
    "py-feat>=2.1.1,<3",
    "emotiefflib>=1.1.1",
    "mediapipe>=0.10.14",
    "l2cs @ git+https://github.com/edavalosanaya/L2CS-Net.git",
    "torch>=2.1",
    "torchvision>=0.16",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/meta_face"]

[tool.hatch.build.targets.sdist]
only-include = ["src/meta_face", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
